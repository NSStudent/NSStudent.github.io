<svg xmlns="http://www.w3.org/2000/svg" width="860" height="474" viewBox="0 0 860 474" role="img" aria-label="Qué se redibuja con cada cosa que pasa" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Qué se redibuja con cada cosa que pasa</title>
<rect width="860" height="474" rx="16" fill="#FFFFFF"/>
<text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C1917" text-anchor="start">Qué se redibuja con cada cosa que pasa</text><text x="32" y="68" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#78716C" text-anchor="start">Cada grupo lee solo el estado que necesita; el resto del tablero no se entera.</text><rect x="368.5" y="89" width="51" height="19" rx="9.5" fill="#F0EFEE" stroke="#57534E" stroke-width="1"/><text x="394" y="103" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#57534E" text-anchor="middle">fondo</text><rect x="485.9" y="89" width="64.19999999999999" height="19" rx="9.5" fill="#FDF3DC" stroke="#C98A0B" stroke-width="1"/><text x="518" y="103" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#C98A0B" text-anchor="middle">partida</text><rect x="596.7" y="89" width="90.6" height="19" rx="9.5" fill="#F2EAFD" stroke="#8A46D7" stroke-width="1"/><text x="642" y="103" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#8A46D7" text-anchor="middle">interacción</text><rect x="737.2" y="89" width="57.599999999999994" height="19" rx="9.5" fill="#E3F4EC" stroke="#3E9A78" stroke-width="1"/><text x="766" y="103" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#3E9A78" text-anchor="middle">piezas</text><rect x="32" y="120" width="796" height="52" rx="10" fill="#FAFAF9" stroke="#D6D3D1"/><text x="48" y="142" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1C1917" text-anchor="start">Cambias el tema del tablero</text><text x="48" y="160" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#78716C" text-anchor="start">background(.updateBoardTheme)</text><rect x="356.8" y="134" width="74.4" height="24" rx="12" fill="#F0EFEE" stroke="#57534E"/><text x="394" y="150.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#57534E" text-anchor="middle">redibuja</text><rect x="486" y="134" width="64" height="24" rx="12" fill="#FDF3DC" stroke="#C98A0B"/><text x="518" y="150.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#C98A0B" text-anchor="middle">color</text><text x="642" y="151" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><text x="766" y="151" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><rect x="32" y="178" width="796" height="52" rx="10" fill="#FFFFFF" stroke="#D6D3D1"/><text x="48" y="200" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1C1917" text-anchor="start">Tocas una pieza</text><text x="48" y="218" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#78716C" text-anchor="start">pieces(.delegate(.userTap))</text><text x="394" y="209" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><text x="518" y="209" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><rect x="608.2" y="192" width="67.6" height="24" rx="12" fill="#F2EAFD" stroke="#8A46D7"/><text x="642" y="208.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8A46D7" text-anchor="middle">aparece</text><text x="766" y="209" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><rect x="32" y="236" width="796" height="52" rx="10" fill="#FAFAF9" stroke="#D6D3D1"/><text x="48" y="258" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1C1917" text-anchor="start">El dedo se mueve en la misma casilla</text><text x="48" y="276" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#78716C" text-anchor="start">@State drag</text><text x="394" y="267" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><text x="518" y="267" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><text x="642" y="267" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><rect x="732.2" y="250" width="67.6" height="24" rx="12" fill="#E3F4EC" stroke="#3E9A78"/><text x="766" y="266.5" font-family="-apple-system, Blink