" y="392" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#78716C" text-anchor="start">game.execute(move:)</text><text x="394" y="383" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><rect x="486" y="366" width="64" height="24" rx="12" fill="#FDF3DC" stroke="#C98A0B"/><text x="518" y="382.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#C98A0B" text-anchor="middle">salta</text><rect x="601.4" y="366" width="81.19999999999999" height="24" rx="12" fill="#F2EAFD" stroke="#8A46D7"/><text x="642" y="382.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8A46D7" text-anchor="middle">se limpia</text><rect x="718.6" y="366" width="94.8" height="24" rx="12" fill="#E3F4EC" stroke="#3E9A78"/><text x="766" y="382.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3E9A78" text-anchor="middle">anima todas</text><text x="32" y="448" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#78716C" text-anchor="start">«salta»: cambia sin animación. «anima todas»: una sola transacción para todas las piezas que cambian.</text>
