/text><rect x="606" y="266" width="222" height="74" rx="12" fill="#E3F4EC" stroke="#3E9A78" stroke-width="1.5"/><text x="717" y="300" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle">La pieza arrastrada</text><text x="717" y="319" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57534E" text-anchor="middle">las demás no se redibujan</text><defs><marker id="a404344404392" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E9A78"/></marker></defs><line x1="404" y1="344" x2="404" y2="392" stroke="#3E9A78" stroke-width="1.8"  marker-end="url(#a404344404392)"/><text x="416" y="372" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3E9A78" text-anchor="start">al empezar, al cruzar de casilla y al soltar</text><rect x="304" y="396" width="200" height="56" rx="12" fill="#E3F4EC" stroke="#3E9A78" stroke-width="1.5"/><text x="404" y="421" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle">Store</text><text x="404" y="440" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#57534E" text-anchor="middle">1 + 1 por casilla + 1</text>
