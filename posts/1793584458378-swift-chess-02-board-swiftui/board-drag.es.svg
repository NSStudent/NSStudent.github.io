nto</text><rect x="304" y="126" width="200" height="74" rx="12" fill="#FDECEC" stroke="#DC2626" stroke-width="1.5"/><text x="404" y="160" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle">Store raíz</text><text x="404" y="179" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57534E" text-anchor="middle">todo el árbol de reducers</text><defs><marker id="a508163602163" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker></defs><line x1="508" y1="163" x2="602" y2="163" stroke="#DC2626" stroke-width="1.8"  marker-end="url(#a508163602163)"/><text x="555" y="155" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#DC2626" text-anchor="middle">redibuja</text><rect x="606" y="126" width="222" height="74" rx="12" fill="#FDECEC" stroke="#DC2626" stroke-width="1.5"/><text x="717" y="160" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle">Todas las piezas</text><text x="717" y="179" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57534E" text-anchor="middle">3–5 ms por evento: va con retraso</text><text x="32" y="252" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3E9A78" text-anchor="start">DESPUÉS: el desplazamiento vive en la vista</text><rect x="32" y="266" width="170" height="74" rx="12" fill="#F0EFEE" stroke="#57534E" stroke-width="1.5"/><text x="117" y="30