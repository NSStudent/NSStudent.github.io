<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-label="Dragging, before and after" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Dragging, before and after</title>
<rect width="860" height="470" rx="16" fill="#FFFFFF"/>
<text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C1917" text-anchor="start">Dragging, before and after</text><text x="32" y="68" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#78716C" text-anchor="start">A mouse sends far more drag events than a finger does.</text><text x="32" y="112" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#DC2626" text-anchor="start">BEFORE: the drag offset lived in the store</text><rect x="32" y="126" width="170" height="74" rx="12" fill="#F0EFEE" stroke="#57534E" stroke-width="1.5"/><text x="117" y="160" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle">Mouse</text><text x="117" y="179" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57534E" text-anchor="middle">up to ~1,200 events/s</text><defs><marker id="a206163300163" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker></defs><line x1="206" y1="163" x2="300" y2="163" stroke="#DC2626" stroke-width="1.8"  marker-end="url(#a206163300163)"/><text x="253" y="141" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#DC2626" text-anchor="middle">4 actions</text><text x="253" y="156" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#DC2626" text-anchor="middle">per event</text><rect x="304" y="126" width="200" height="74" rx="12" fill="#FDECEC" stroke="#DC2626" stroke-width="1.5"/><text x="404" y="160" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle">Root store</text><text x="404" y="179" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57534E" text-anchor="middle">the whole reducer tree</text><defs><marker id="a508163602163" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker></defs><line x1="508" y1="163" x2="602" y2="163" stroke="#DC2626" stroke-width="1.8"  marker-end="url(#a508163602163)"/><text x="555" y="155" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#DC2626" text-anchor="middle">redraws</text><rect x="606" y="126" width="222" height="74" rx="12" fill="#FDECEC" stroke="#DC2626" stroke-width="1.5"/><text x="717" y="160" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle">Every piece</text><text x="717" y="179" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57534E" text-anchor="middle">3–5 ms per event: it lags</text><text x="32" y="252" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3E9A78" text-anchor="start">AFTER: the drag offset lives in the view</text><rect x="32" y="266" width="170" height="74" rx="12" fill="#F0EFEE" stroke="#57534E" stroke-width="1.5"/><text x="117" y="300" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle">Mouse</text><text x="117" y="319" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57534E" text-anchor="middle">up to ~1,200 events/s</text><defs><marker id="a206303300303" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A46D7"/></marker></defs><line x1="206" y1="303" x2="300" y2="303" stroke="#8A46D7" stroke-width="1.8"  marker-end="url(#a206303300303)"/><text x="253" y="295" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8A46D7" text-anchor="middle">every event</text><rect x="304" y="266" width="200" height="74" rx="12" fill="#F2EAFD" stroke="#8A46D7" stroke-width="1.5"/><text x="404" y="300" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle">@State PieceDrag</text><text x="404" y="319" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57534E" text-anchor="middle">translation · targetSquare</text><defs><marker id="a508303602303" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A46D7"/></marker></defs><line x1="508" y1="303" x2="602" y2="303" stroke="#8A46D7" stroke-width="1.8"  marker-end="url(#a508303602303)"/><text x="555" y="295" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8A46D7" text-anchor="middle">this view only</text><rect x="606" y="266" width="222" height="74" rx="12" fill="#E3F4EC" stroke="#3E9A78" stroke-width="1.5"/><text x="717" y="300" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle">The dragged piece</text><text x="717" y="319" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57534E" text-anchor="middle">the others are not redrawn</text><defs><marker id="a404344404392" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E9A78"/></marker></defs><line x1="404" y1="344" x2="404" y2="392" stroke="#3E9A78" stroke-width="1.8"  marker-end="url(#a404344404392)"/><text x="416" y="372" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3E9A78" text-anchor="start">on start, on each new square and on drop</text><rect x="304" y="396" width="200" height="56" rx="12" fill="#E3F4EC" stroke="#3E9A78" stroke-width="1.5"/><text x="404" y="421" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C1917" text-anchor="middle">Store</text><text x="404" y="440" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#57534E" text-anchor="middle">1 + 1 per square + 1</text>
</svg>
