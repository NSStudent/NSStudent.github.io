<svg xmlns="http://www.w3.org/2000/svg" width="860" height="474" viewBox="0 0 860 474" role="img" aria-label="What redraws when something happens" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>What redraws when something happens</title>
<rect width="860" height="474" rx="16" fill="#FFFFFF"/>
<text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C1917" text-anchor="start">What redraws when something happens</text><text x="32" y="68" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#78716C" text-anchor="start">Each group reads only the state it needs; the rest of the board never hears about it.</text><rect x="352" y="89" width="84" height="19" rx="9.5" fill="#F0EFEE" stroke="#57534E" stroke-width="1"/><text x="394" y="103" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#57534E" text-anchor="middle">background</text><rect x="495.8" y="89" width="44.4" height="19" rx="9.5" fill="#FDF3DC" stroke="#C98A0B" stroke-width="1"/><text x="518" y="103" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#C98A0B" text-anchor="middle">game</text><rect x="596.7" y="89" width="90.6" height="19" rx="9.5" fill="#F2EAFD" stroke="#8A46D7" stroke-width="1"/><text x="642" y="103" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#8A46D7" text-anchor="middle">interaction</text><rect x="737.2" y="89" width="57.599999999999994" height="19" rx="9.5" fill="#E3F4EC" stroke="#3E9A78" stroke-width="1"/><text x="766" y="103" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#3E9A78" text-anchor="middle">pieces</text><rect x="32" y="120" width="796" height="52" rx="10" fill="#FAFAF9" stroke="#D6D3D1"/><text x="48" y="142" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1C1917" text-anchor="start">You change the board theme</text><text x="48" y="160" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#78716C" text-anchor="start">background(.updateBoardTheme)</text><rect x="360.2" y="134" width="67.6" height="24" rx="12" fill="#F0EFEE" stroke="#57534E"/><text x="394" y="150.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#57534E" text-anchor="middle">redraws</text><rect x="486" y="134" width="64" height="24" rx="12" fill="#FDF3DC" stroke="#C98A0B"/><text x="518" y="150.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#C98A0B" text-anchor="middle">color</text><text x="642" y="151" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><text x="766" y="151" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><rect x="32" y="178" width="796" height="52" rx="10" fill="#FFFFFF" stroke="#D6D3D1"/><text x="48" y="200" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1C1917" text-anchor="start">You tap a piece</text><text x="48" y="218" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#78716C" text-anchor="start">pieces(.delegate(.userTap))</text><text x="394" y="209" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><text x="518" y="209" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><rect x="608.2" y="192" width="67.6" height="24" rx="12" fill="#F2EAFD" stroke="#8A46D7"/><text x="642" y="208.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8A46D7" text-anchor="middle">appears</text><text x="766" y="209" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><rect x="32" y="236" width="796" height="52" rx="10" fill="#FAFAF9" stroke="#D6D3D1"/><text x="48" y="258" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1C1917" text-anchor="start">The finger moves inside one square</text><text x="48" y="276" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#78716C" text-anchor="start">@State drag</text><text x="394" y="267" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><text x="518" y="267" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><text x="642" y="267" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><rect x="732.2" y="250" width="67.6" height="24" rx="12" fill="#E3F4EC" stroke="#3E9A78"/><text x="766" y="266.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3E9A78" text-anchor="middle">1 piece</text><rect x="32" y="294" width="796" height="52" rx="10" fill="#FFFFFF" stroke="#D6D3D1"/><text x="48" y="316" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1C1917" text-anchor="start">The finger crosses into another square</text><text x="48" y="334" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#78716C" text-anchor="start">pieces(.delegate(.userDragging))</text><text x="394" y="325" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><text x="518" y="325" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><rect x="610" y="308" width="64" height="24" rx="12" fill="#F2EAFD" stroke="#8A46D7"/><text x="642" y="324.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8A46D7" text-anchor="middle">moves</text><rect x="732.2" y="308" width="67.6" height="24" rx="12" fill="#E3F4EC" stroke="#3E9A78"/><text x="766" y="324.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3E9A78" text-anchor="middle">1 piece</text><rect x="32" y="352" width="796" height="52" rx="10" fill="#FAFAF9" stroke="#D6D3D1"/><text x="48" y="374" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1C1917" text-anchor="start">A move is played</text><text x="48" y="392" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#78716C" text-anchor="start">game.execute(move:)</text><text x="394" y="383" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#D6D3D1" text-anchor="middle">—</text><rect x="486" y="366" width="64" height="24" rx="12" fill="#FDF3DC" stroke="#C98A0B"/><text x="518" y="382.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#C98A0B" text-anchor="middle">jumps</text><rect x="610" y="366" width="64" height="24" rx="12" fill="#F2EAFD" stroke="#8A46D7"/><text x="642" y="382.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8A46D7" text-anchor="middle">clears</text><rect x="715.2" y="366" width="101.6" height="24" rx="12" fill="#E3F4EC" stroke="#3E9A78"/><text x="766" y="382.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3E9A78" text-anchor="middle">animates all</text><text x="32" y="448" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#78716C" text-anchor="start">“jumps”: changes with no animation. “animates all”: one transaction for every piece that changes.</text>
</svg>
